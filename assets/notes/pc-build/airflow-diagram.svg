<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect width="920" height="520" fill="#ffffff"/>
  <defs>
    <marker id="in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
  </defs>
  <text x="460" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Where the air goes: 6 fans in, 4 out</text>

  <!-- Gabinete visto de frente por el vidrio -->
  <rect x="200" y="90" width="520" height="340" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <line x1="590" y1="90" x2="590" y2="430" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Radiador arriba -->
  <rect x="250" y="104" width="300" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="400" y="124" text-anchor="middle" font-size="12" fill="#7f1d1d">360 radiator, 3 fans</text>
  <!-- Ventilador trasero -->
  <rect x="212" y="150" width="30" height="70" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <!-- Ventiladores de abajo -->
  <rect x="250" y="388" width="300" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="400" y="408" text-anchor="middle" font-size="12" fill="#1e3a8a">3 fans from the case</text>
  <!-- Ventiladores laterales -->
  <rect x="604" y="130" width="34" height="270" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="621" y="268" text-anchor="middle" font-size="12" fill="#1e3a8a" transform="rotate(-90 621 268)">3 reverse fans</text>

  <!-- Placa y GPU -->
  <rect x="270" y="160" width="290" height="120" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="415" y="225" text-anchor="middle" font-size="13" fill="#334155">Motherboard + CPU</text>
  <rect x="270" y="300" width="290" height="44" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="415" y="327" text-anchor="middle" font-size="13" fill="#334155">RTX 5070 Ti</text>

  <!-- Flechas de entrada -->
  <g stroke="#2563eb" stroke-width="3" marker-end="url(#in)">
    <line x1="310" y1="475" x2="310" y2="352"/>
    <line x1="400" y1="475" x2="400" y2="352"/>
    <line x1="490" y1="475" x2="490" y2="352"/>
    <line x1="790" y1="170" x2="648" y2="170"/>
    <line x1="790" y1="265" x2="648" y2="265"/>
    <line x1="790" y1="360" x2="648" y2="360"/>
  </g>
  <!-- Flechas de salida -->
  <g stroke="#dc2626" stroke-width="3" marker-end="url(#out)">
    <line x1="310" y1="100" x2="310" y2="56"/>
    <line x1="400" y1="100" x2="400" y2="56"/>
    <line x1="490" y1="100" x2="490" y2="56"/>
    <line x1="208" y1="185" x2="130" y2="185"/>
  </g>
  <text x="120" y="215" text-anchor="end" font-size="12" fill="#7f1d1d">back fan, out</text>

  <!-- Leyenda -->
  <g font-size="13" fill="#0f172a">
    <line x1="250" y1="497" x2="280" y2="497" stroke="#2563eb" stroke-width="3"/>
    <text x="288" y="501">cold air in</text>
    <line x1="400" y1="497" x2="430" y2="497" stroke="#dc2626" stroke-width="3"/>
    <text x="438" y="501">hot air out</text>
    <text x="560" y="501" fill="#475569">more in than out: positive pressure, less dust</text>
  </g>
</svg>
